    <script>
      // 防止亮暗切换闪烁：在 React 渲染前先按本地存储/系统偏好设置主题
      (function () {
        var t = localStorage.getItem('blog-theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
